configs:
  realm:
    content: |
      {
        "realm": "ise",
        "enabled": true,
        "accessTokenLifespan": 300,
        "ssoSessionIdleTimeout": 1800,
        "ssoSessionMaxLifespan": 36000,
        "clients": [{
          "clientId": "ise-recorder",
          "publicClient": true,
          "standardFlowEnabled": true,
          "redirectUris": [ "http://localhost:3000/auth/callback" ],
          "webOrigins": [ "http://localhost:3000" ],
          "protocolMappers": [{
            "name": "audience",
            "protocol": "openid-connect",
            "protocolMapper": "oidc-audience-mapper",
            "config": {
              "included.client.audience": "ise-recorder-users",
              "access.token.claim": "true"
            }
          }]
        }],
        "users": [{
          "username": "lecturer",
          "enabled": true,
          "email": "lecturer@example.com",
          "emailVerified": true,
          "firstName": "Dr.",
          "lastName": "Lecturer",
          "requiredActions": [],
          "credentials": [{ "type": "password", "value": "hunter2", "temporary": false }]
        }]
      }    

services:
  frontend:
    image: code.rinderher.de/library/ise-recorder:${ISE_RECORD_TAG:-latest}
    build: frontend
    pull_policy: daily
    container_name: ise-recorder-frontend
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000
    environment:
      - TZ=Europe/Berlin
      - ISE_RECORD_API_URL=http://localhost:8000
      - ISE_RECORD_SHOW_VERSION=true
      - ISE_RECORD_OIDC_URL=http://keycloak.localhost:8080/realms/ise
      - ISE_RECORD_OIDC_CLIENT_ID=ise-recorder
      - ISE_RECORD_OIDC_MAX_AGE=25200 # 7 hours

  backend:
    image: code.rinderher.de/library/ise-recorder-backend:${ISE_RECORD_TAG:-latest}
    build: backend
    pull_policy: daily
    container_name: ise-recorder-backend
    init: true
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
    user: 1000:1000
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - ./data:/app/data
    command:
      - --log-level
      - debug
    environment:
      - TZ=Europe/Berlin
      - ISE_RECORD_CORS_ORIGINS=[ "http://localhost:3000" ]
      - ISE_RECORD_OIDC__PROVIDER_URL=http://keycloak.localhost:8080/realms/ise
      - ISE_RECORD_OIDC__AUDIENCE=ise-recorder-users

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: [ "start-dev", "--import-realm" ]
    ports:
      - 127.0.0.1:8080:8080
      - "[::1]:8080:8080"
    networks:
      default:
        aliases:
          - keycloak.localhost
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=http://keycloak.localhost:8080
      - KC_HEALTH_ENABLED=true
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    configs:
      - source: realm
        target: /opt/keycloak/data/import/realm.json
