[project]
name = "ise-record"
version = "1.0.10"
requires-python = "~=3.14"

dependencies = [
    "aiofiles~=25.1",
    "aiosmtplib~=5.1",
    "email-validator~=2.3",
    "fastapi~=0.136",
    "httpx2~=2.2",
    "pwdlib[argon2]~=0.3",
    "pydantic-settings~=2.13",
    "PyJWT[crypto]~=2.13",
    "python-multipart~=0.0",
    "sqlmodel~=0.0",
    "uvicorn~=0.44",
]

[dependency-groups]
test = [
    "pytest~=9.0",
    "pytest-asyncio~=1.3",
    "pytest-mock~=3.15",
]

dev = [
    { include-group = "test" },
    "fastapi[standard]",
    "pylint~=4.0",
]

[build-system]
requires = ["setuptools >= 82.0.1"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.pyright]
useLibraryCodeForTypes = true

[tool.fastapi]
entrypoint = "ise_record.server:app"
