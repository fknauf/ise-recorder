services:
  frontend:
    image: code.rinderher.de/library/ise-recorder:${ISE_RECORD_TAG:-latest}
    build: frontend
    pull_policy: daily
    container_name: ise-recorder-frontend
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000
    environment:
      - TZ=Europe/Berlin
      - ISE_RECORD_API_URL=http://localhost:8000
      - ISE_RECORD_SHOW_VERSION=true
# see compose-with-auth.yaml for a deployment with oidc authentication
#      - ISE_RECORD_OIDC_PROVIDER_URL=http://keycloak.localhost:8080/realms/ise
#      - ISE_RECORD_OIDC_CLIENT_ID=ise-recorder
#      - ISE_RECORD_OIDC_MAX_AGE=2505600 # 29 days
#      - ISE_RECORD_OIDC_AUTO_SIGNIN=true

  backend:
    image: code.rinderher.de/library/ise-recorder-backend:${ISE_RECORD_TAG:-latest}
    build: backend
    pull_policy: daily
    container_name: ise-recorder-backend
    init: true
    restart: unless-stopped
    user: 1000:1000
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - ./data:/app/data
    command:
      - --log-level
      - debug
#      - --no-access-log
    environment:
      - TZ=Europe/Berlin
      - ISE_RECORD_CORS_ORIGINS=[ "http://localhost:3000" ]
#      - ISE_RECORD_DESTDIR=/app/data
#      - ISE_RECORD_ROUTE_PREFIX=/some/path
#      - ISE_RECORD_SMTP_SERVER=mail.example.com
#      - ISE_RECORD_SMTP_PORT=25
#      - ISE_RECORD_SMTP_LOCAL_HOSTNAME=ise-record.example.com
#      - ISE_RECORD_SMTP_USERNAME=user1
#      - ISE_RECORD_SMTP_PASSWORD=supersecure
#      - ISE_RECORD_SMTP_SENDER=ise-record@example.com
#      - ISE_RECORD_SMTP_STARTTLS=false
#      - ISE_RECORD_SMTP_USE_TLS=true
#      - ISE_RECORD_SMTP_ALLOWED_DOMAINS=[ "example.com", "example.org" ]
#      - ISE_RECORD_CHUNK_FILE_DIGITS=4
# see compose-with-auth.yaml for a deployment with oidc authentication
#      - ISE_RECORD_OIDC_PROVIDER_URL=http://keycloak.localhost:8080/realms/ise
#      - ISE_RECORD_OIDC_AUDIENCE=ise-recorder
#      - ISE_RECORD_OIDC_LEEWAY_SECONDS=30
#      - ISE_RECORD_OIDC_HTTP_TIMEOUT_SECONDS=5
